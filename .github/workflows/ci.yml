name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MveTools.slnx

      - name: Build
        run: dotnet build MveTools.slnx --configuration Release --no-restore

      - name: Test
        shell: bash
        run: |
          if [[ -n "$(find . -name '*.Tests.csproj' -not -path './.git/*' | head -n 1)" ]]; then
            dotnet test MveTools.slnx --configuration Release --no-build
          else
            echo "::notice::The solution has no test project, nothing to run."
          fi

      - name: Run the CLI
        run: dotnet run --project MveTools.Cli --configuration Release --no-build -- --help

  # Builds the downloadable binaries of every push to main (kept 7 days) to catch publishing problems early.
  binaries:
    name: Binaries
    if: github.event_name != 'pull_request'
    needs: build-and-test
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: 0.0.0-ci.${{ github.run_number }}
      retention-days: 7