name: Nightly

# Every night, when main has changed since the last nightly build, replaces the "nightly" pre-release with fresh binaries
# (same archives as a release, version 0.0.0-nightly.<run number>).

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has not changed since the last nightly build
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Compare with the last nightly build
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          last="$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" --jq .object.sha 2> /dev/null || true)"
          if [[ "$last" == "$GITHUB_SHA" && "$FORCE" != "true" ]]; then
            echo "Nothing changed since the last nightly build ($last)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    name: Binaries
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: 0.0.0-nightly.${{ github.run_number }}
      retention-days: 7

  publish:
    name: Publish the nightly pre-release
    needs: [check, binaries]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: release
          merge-multiple: true

      - name: Write the checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -- *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Replace the nightly pre-release
        run: |
          set -euo pipefail
          gh release delete nightly --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create nightly release/* \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly build" \
            --notes "Automatic build of the latest commit on main ($GITHUB_SHA). It may be unstable: use a versioned release for anything important. Files are described in the notes of a regular release."