version: 2
updates:
  # Dependabot only works through pull requests: every ecosystem is grouped in a single one, checked once a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      nuget:
        patterns: ["*"]